[package]
name = "meson-leptos"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
description = "Meson File UI — MesonImg wrapping Orbital Image with virus-scan status sync"
publish = false

[lints]
workspace = true

[dependencies]
leptos = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
orbital-primitives = { workspace = true, default-features = false }
orbital-core-components = { workspace = true, default-features = false }
photon-leptos = { workspace = true, default-features = false, optional = true }
meson = { path = "../meson", default-features = false, optional = true }
valence = { workspace = true, optional = true }
higgs = { workspace = true, optional = true }
tracing = { workspace = true, optional = true }
axum = { workspace = true, optional = true }

[features]
default = []
hydrate = [
    "leptos/hydrate",
    "orbital-primitives/hydrate",
    "orbital-core-components/hydrate",
    "dep:photon-leptos",
    "photon-leptos/hydrate",
]
ssr = [
    "leptos/ssr",
    "orbital-primitives/ssr",
    "orbital-core-components/ssr",
    "dep:meson",
    "meson/db-sqlite",
    "meson/backend-local",
    "dep:valence",
    "valence/sqlite",
    "dep:higgs",
    "higgs/ssr",
    "dep:photon-leptos",
    "photon-leptos/ssr",
    "dep:tracing",
    "dep:axum",
]
